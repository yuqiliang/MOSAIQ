$schema: https://specs.frictionlessdata.io/schemas/table-schema.json
name: mosaiq_delta_responses
title: MOSAIQ DeLTA Response-level Schema
description: |
  One row per DeLTA listening-experiment response, preserving annoyance and
  the 24 binary sound-source labels from the source workbook.

primaryKey:
  - response_id

fields:
  - name: response_id
    type: string
    constraints:
      required: true
      unique: true
      pattern: "^DeLTA_.+$"
  - name: clip_id
    type: string
    constraints:
      required: true
      pattern: "^DeLTA_.+$"
  - name: participant_id
    type: string
    constraints:
      required: true
  - name: recording
    type: string
  - name: start_time_excel
    type: number
  - name: end_time_excel
    type: number
  - name: gender
    type: string
  - name: age
    type: integer
    constraints: { minimum: 0 }
  - name: experiment_id
    type: string
  - name: version
    type: string
  - name: tree_node_key
    type: string
  - name: annoyance
    type: integer
    constraints: { minimum: 1, maximum: 10 }
  - name: source_aircraft
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_bells
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_bird_tweet
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_bus
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_car
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_children
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_construction
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_dog_bark
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_footsteps
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_general_traffic
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_horn
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_laughter
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_motorcycle
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_music
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_non_identifiable
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_other
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_rail
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_rustling_leaves
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_screeching_brakes
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_shouting
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_siren
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_speech
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_ventilation
    type: integer
    constraints: { enum: [0, 1] }
  - name: source_water
    type: integer
    constraints: { enum: [0, 1] }
