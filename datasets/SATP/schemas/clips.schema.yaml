$schema: https://specs.frictionlessdata.io/schemas/table-schema.json
name: mosaiq_satp_clips
title: MOSAIQ SATP Clip-level Schema
description: |
  One row per SATP recording. PAQ means are converted from the SATP 0-100
  response scale to MOSAIQ's 1-5 PAQ scale; raw 0-100 loudness is preserved.

primaryKey:
  - clip_id

fields:
  - name: clip_id
    type: string
    constraints:
      required: true
      unique: true
      pattern: "^SATP_.+$"
  - name: dataset_id
    type: string
    constraints:
      required: true
      enum: [SATP]
  - name: recording
    type: string
    constraints:
      required: true
  - name: audio_asset
    type: string
  - name: licence_spdx
    type: string
    constraints:
      required: true
      enum: [CC-BY-4.0]
  - name: n_responses
    type: integer
    constraints:
      required: true
      minimum: 1
  - name: n_participants
    type: integer
    constraints:
      required: true
      minimum: 1
  - name: n_languages
    type: integer
    constraints:
      minimum: 1
  - name: mean_PAQ1_pleasant
    type: number
    constraints: { minimum: 1, maximum: 5 }
  - name: mean_PAQ2_vibrant
    type: number
    constraints: { minimum: 1, maximum: 5 }
  - name: mean_PAQ3_eventful
    type: number
    constraints: { minimum: 1, maximum: 5 }
  - name: mean_PAQ4_chaotic
    type: number
    constraints: { minimum: 1, maximum: 5 }
  - name: mean_PAQ5_annoying
    type: number
    constraints: { minimum: 1, maximum: 5 }
  - name: mean_PAQ6_monotonous
    type: number
    constraints: { minimum: 1, maximum: 5 }
  - name: mean_PAQ7_uneventful
    type: number
    constraints: { minimum: 1, maximum: 5 }
  - name: mean_PAQ8_calm
    type: number
    constraints: { minimum: 1, maximum: 5 }
  - name: mean_loud_raw_0_100
    type: number
    constraints: { minimum: 0, maximum: 100 }
  - name: mean_ISOPleasant
    type: number
    constraints: { minimum: -1, maximum: 1 }
  - name: mean_ISOEventful
    type: number
    constraints: { minimum: -1, maximum: 1 }
