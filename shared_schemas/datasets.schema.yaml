$schema: https://specs.frictionlessdata.io/schemas/table-schema.json
name: mosaiq_datasets
title: MOSAIQ Dataset-level Schema
description: |
  Schema for the dataset-level catalogue. Each row describes one source
  dataset (e.g., ISD, ARAUS) with its scale, modalities, recording details,
  perceptual framework, rating-scale information, access conditions,
  documentation limits, and provenance. The catalogue supports comparison
  across heterogeneous soundscape datasets without forcing all datasets into
  a single identical clip-level format. All durations are normalised to
  seconds (audio clip duration) or minutes (total dataset duration); all
  sampling rates in Hz; bit depths in bits.

  Foreign key target: clips.dataset_id references datasets.dataset_id.

primaryKey:
  - dataset_id

fields:
  # =========================================================
  # 1. Identification
  # =========================================================
  - name: dataset_id
    type: string
    description: Stable short identifier used by clip-level tables.
    constraints:
      required: true
      unique: true

  - name: dataset_name
    type: string
    description: Human-readable dataset name.
    constraints:
      required: true

  - name: description
    type: string
    description: Brief textual description of the dataset

  - name: year
    type: integer
    description: Year of dataset release or first publication
    constraints:
      minimum: 2000
      maximum: 2030

  - name: scenario
    type: string
    description: Primary acoustic environment type
    constraints:
      enum: [Urban, Indoor, Natural, Various]

  - name: link
    type: string
    format: uri
    description: Permanent URL or DOI to the dataset

  - name: source_reference
    type: string
    description: DOI, URL, publication, or source record used for catalogue metadata

  # =========================================================
  # 2. Access & licensing
  # =========================================================
  - name: access
    type: string
    description: Public availability of the dataset
    constraints:
      required: true
      enum: [Fully, Partially, Restricted]

  - name: access_status
    type: string
    description: Free-text access status preserved for comparison and provenance

  - name: licence_spdx
    type: string
    description: SPDX licence identifier
    constraints:
      enum: [CC-BY-4.0, CC-BY-NC-4.0, CC-BY-NC-SA-4.0, CC-BY-SA-4.0, MIT, Other, Unknown]

  # =========================================================
  # 3. Scale
  # =========================================================
  - name: n_audio_samples
    type: integer
    description: Number of audio recordings
    constraints: { minimum: 0 }

  - name: n_participants
    type: integer
    description: Number of participants providing assessments
    constraints: { minimum: 0 }

  - name: n_assessments
    type: integer
    description: Total perceptual assessments collected
    constraints: { minimum: 0 }

  - name: total_duration_min
    type: number
    description: Total duration of audio material (minutes)
    constraints: { minimum: 0 }

  - name: scale
    type: string
    description: Human-readable scale summary, e.g. clips, participants, assessments

  # =========================================================
  # 4. Audio modalities (binary availability + technical specs)
  # =========================================================
  - name: modality_availability
    type: string
    description: Compact summary of available audio, visual, and contextual modalities

  - name: audio_format
    type: string
    description: Compact summary of available audio formats or channel types

  - name: audio_ambisonics_available
    type: boolean
    description: Ambisonics audio available

  - name: audio_ambisonics_bit_depth
    type: integer
    description: Ambisonics audio bit depth
    constraints: { enum: [16, 24, 32] }

  - name: audio_ambisonics_sampling_rate_hz
    type: integer
    description: Ambisonics sampling rate (Hz)
    constraints: { enum: [44100, 48000, 96000] }

  - name: audio_ambisonics_order
    type: integer
    description: Ambisonics order (1 = FOA, 3 = third-order, etc.)
    constraints: { minimum: 1, maximum: 7 }

  - name: audio_ambisonics_clip_duration_s
    type: number
    description: Typical ambisonics clip duration (seconds)
    constraints: { minimum: 0 }

  - name: audio_binaural_available
    type: boolean

  - name: audio_binaural_bit_depth
    type: integer
    constraints: { enum: [16, 24, 32] }

  - name: audio_binaural_sampling_rate_hz
    type: integer
    constraints: { enum: [44100, 48000, 96000] }

  - name: audio_binaural_clip_duration_s
    type: number
    constraints: { minimum: 0 }

  - name: audio_monaural_available
    type: boolean

  - name: audio_monaural_clip_duration_s
    type: number
    constraints: { minimum: 0 }

  # =========================================================
  # 5. Visual modality
  # =========================================================
  - name: visual_available
    type: boolean
    description: Visual content (image / video) available

  - name: visual_format
    type: string
    description: Visual content format
    constraints:
      enum: ["Images", "Video", "360 Video", "Mixed", ""]

  - name: visual_resolution
    type: string
    description: Resolution descriptor (e.g., "4K", "1080p", "3840x2160")

  - name: visual_frame_rate_fps
    type: integer
    description: Video frame rate (frames per second)
    constraints: { minimum: 1, maximum: 240 }

  - name: visual_clip_duration_s
    type: number
    description: Typical visual clip duration (seconds)
    constraints: { minimum: 0 }

  # =========================================================
  # 6. Perceptual annotation framework
  # =========================================================
  - name: annotation_framework
    type: string
    description: Perceptual / affective annotation framework
    constraints:
      required: true

  - name: perceptual_framework
    type: string
    description: Alias/summary field for the perceptual framework

  - name: experimental_setting
    type: string
    description: Setting in which assessments were collected
    constraints:
      enum: [On-site, Lab-based, Online, Mixed, Other]

  - name: rating_scale_information
    type: string
    description: Original rating scale information and harmonisation notes where known

  - name: recording_protocol
    type: string
    description: Summary of data capture or stimulus generation protocol

  - name: reproduction_protocol
    type: string
    description: Summary of playback or participant assessment protocol

  # =========================================================
  # 7. Acoustic / environmental measurements
  # =========================================================
  - name: acoustic_data_available
    type: boolean
    description: Objective acoustic / psychoacoustic measurements provided

  - name: acoustic_measuring_instrument
    type: string
    description: Instrument or tool used to derive acoustic metrics

  - name: environmental_data_available
    type: boolean
    description: Environmental context data (temperature, humidity, etc.) provided

  # =========================================================
  # 8. Documentation, limitations, and provenance
  # =========================================================
  - name: metadata_availability
    type: string
    description: Summary of whether dataset metadata are complete, partial, or unknown

  - name: known_limitations
    type: string
    description: Known documentation, access, or harmonisation limitations

  - name: schema_version
    type: string
    description: MOSAIQ catalogue schema version used for this row

  - name: provenance
    type: string
    description: Source and curation provenance for the catalogue row
