$schema: https://specs.frictionlessdata.io/schemas/data-package.json
name: mosaiq
title: MOSAIQ – Multimodal Open Soundscape AI Quality-benchmark
description: |
 A multimodal soundscape benchmark schema linking audio, visual, perceptual, psychoacoustic, and contextual metadata for soundscape AI research.

  Resources are organised in three tiers:
    - datasets:  one row per source dataset (top-level catalogue)
    - clips:     one row per clip (aggregated perception + primary psychoacoustics)
    - responses: one row per individual participant response

version: "0.1.0"
licenses:
  - name: CC-BY-4.0
    title: Creative Commons Attribution 4.0 International
    path: https://creativecommons.org/licenses/by/4.0/

contributors:
  - title: Yuqi Liang
    role: author
    organization: UCL Institute for Environmental Design and Engineering
  - title: Francesco Aletta
    role: author
    organization: UCL Institute for Environmental Design and Engineering
  - title: Andrew Mitchell
    role: author
    organization: Catapult
  - title: Jian Kang
    role: author
    organization: UCL Institute for Environmental Design and Engineering

resources:
  - name: datasets
    title: Dataset-level catalogue
    path: data/catalogue/datasets.csv
    format: csv
    mediatype: text/csv
    encoding: utf-8
    schema: schemas/datasets.schema.yaml

  - name: clips
    title: Clip-level metadata (aggregated)
    path: data/ISD/clips.csv
    format: csv
    mediatype: text/csv
    encoding: utf-8
    schema: schemas/clips.schema.yaml

  - name: responses
    title: Response-level metadata (per-participant)
    path: data/ISD/responses.csv
    format: csv
    mediatype: text/csv
    encoding: utf-8
    schema:
      fields:
        - name: response_id
          type: string
          constraints: { required: true, unique: true }
        - name: clip_id
          type: string
          constraints: { required: true }
        - name: participant_id
          type: string
        - name: language
          type: string
        - name: PAQ1_pleasant
          type: number
          constraints: { minimum: 1, maximum: 5 }
        - name: PAQ2_vibrant
          type: number
          constraints: { minimum: 1, maximum: 5 }
        - name: PAQ3_eventful
          type: number
          constraints: { minimum: 1, maximum: 5 }
        - name: PAQ4_chaotic
          type: number
          constraints: { minimum: 1, maximum: 5 }
        - name: PAQ5_annoying
          type: number
          constraints: { minimum: 1, maximum: 5 }
        - name: PAQ6_monotonous
          type: number
          constraints: { minimum: 1, maximum: 5 }
        - name: PAQ7_uneventful
          type: number
          constraints: { minimum: 1, maximum: 5 }
        - name: PAQ8_calm
          type: number
          constraints: { minimum: 1, maximum: 5 }
        - name: ISOPleasant
          type: number
          constraints: { minimum: -1, maximum: 1 }
        - name: ISOEventful
          type: number
          constraints: { minimum: -1, maximum: 1 }
        - name: age
          type: number
        - name: gender
          type: string
      primaryKey:
        - response_id
      foreignKeys:
        - fields: clip_id
          reference:
            resource: clips
            fields: clip_id
