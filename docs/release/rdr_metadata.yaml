review_before_publication:
  - Confirm all author names, order, affiliations, and ORCIDs.
  - Add confirmed funder names and grant identifiers.
  - Complete ARAUS source and per-file rights review.
  - Replace the ARAUS source register with a complete verified media extension
    only if written redistribution permission and per-file terms allow it.
  - Confirm owner approval for MOSAIQ-generated CC BY 4.0 content.
  - Confirm participant-data and consent wording with UCL research data support.
  - Complete independent usability review.
  - Replace the development version and candidate freeze with the release tag.
  - Confirm whether the ISD audio extension remains in the public record.
  - Obtain explicit co-author approval before publishing or minting a DOI.
