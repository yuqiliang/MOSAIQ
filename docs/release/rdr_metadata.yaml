description: >-
  MOSAIQ is a reproducible soundscape benchmark for harmonised data, fixed
  evaluation splits, technical validation, and reference prediction models.
  The core package harmonises tabular records from ISD, ARAUS, SATP, and DeLTA
  under shared schemas; defines seven clip- and response-level tasks; and
  includes deterministic leakage-aware splits, frozen manifests, baseline
  predictions, robustness analyses, model and data cards, validators, tests,
  and manuscript-facing fixed outputs. A separately versioned ISD audio
  reference extension contains 820 accepted stereo WAV files from seven
  official source archives in one ZIP64 package, organised into 546 train, 154
  development, and 120 test clips. The audio extension is ISD-only. A separate
  ARAUS v1 source register freezes the official ARAUS v4.2 and USotW source
  records, scope decisions, source checksums, and acquisition code, but does
  not include ARAUS or USotW media. SATP and DeLTA raw media are not
  redistributed. All accepted ISD WAV files retain a calibration warning.
  This record remains a private development draft and must not be submitted for
  review, published, or assigned a DOI until participant-data, rights,
  authorship, funding, licence, and release-version gates are confirmed.

