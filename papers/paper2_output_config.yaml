interpretation_rules:
  - Tables report the released test partition unless explicitly labelled otherwise.
  - Model comparisons require matching feature cohort, n_train, and n_eval.
  - ARAUS test estimates are based on 48 records and must retain that limitation.
  - Positive paired improvement always favours the candidate model.
  - Bootstrap intervals condition on the released test sample and are not external validation.
  - All current baseline and robustness results use audio_used=false.
