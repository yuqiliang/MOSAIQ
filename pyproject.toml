[project]
name = "mosaiq"
version = "0.1.0"
description = "Versioned schemas, splits, validators, and baselines for the MOSAIQ soundscape benchmark"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "frictionless>=5.19.0",
    "iterative-stratification>=0.1.9",
    "jsonschema>=4.26.0",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.0",
    "xgboost>=3.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
]
