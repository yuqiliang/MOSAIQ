$schema: https://json-schema.org/draft/2020-12/schema
$id: https://mosaiq-benchmark.org/schemas/task.schema.yaml
title: MOSAIQ benchmark task configuration
type: object
additionalProperties: false
required:
  - schema_version
  - task
  - input
  - target
  - split_protocol
  - evaluation
properties:
  schema_version:
    type: string
    const: "0.1"
  task:
    type: object
    additionalProperties: false
    required: [id, version, title, status, description, unit_of_analysis, task_type]
    properties:
      id:
        type: string
        pattern: ^[a-z][a-z0-9_]+$
      version:
        type: string
        pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
      title:
        type: string
        minLength: 1
      status:
        enum: [draft, ready, deprecated]
      description:
        type: string
        minLength: 1
      unit_of_analysis:
        enum: [clip, response]
      task_type:
        enum: [regression, multi_output_regression, multilabel_classification]
  input:
    type: object
    additionalProperties: false
    required: [record_type, id_column, datasets]
    properties:
      record_type:
        enum: [clips, responses]
      id_column:
        enum: [clip_id, response_id]
      split_link_column:
        type: string
        minLength: 1
      datasets:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/dataset"
  target:
    type: object
    additionalProperties: false
    required: [columns, representation, missing_value_policy]
    properties:
      columns:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
      representation:
        type: string
        minLength: 1
      scale:
        type: object
        additionalProperties: false
        required: [minimum, maximum]
        properties:
          minimum: {type: number}
          maximum: {type: number}
      labels:
        type: array
        uniqueItems: true
        items: {type: string}
      aggregation:
        type: string
        minLength: 1
      missing_value_policy:
        enum: [drop_row, error]
  split_protocol:
    type: object
    additionalProperties: false
    required: [status, version, protocol, assignment_files, rules, leakage_constraints]
    properties:
      status:
        enum: [pending, released]
      version:
        type: string
        pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
      protocol:
        enum: [fixed_train_dev_test, grouped_cross_validation, dataset_specific]
      assignment_files:
        type: object
        minProperties: 1
        additionalProperties:
          type: string
      rules:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [dataset_id, method, description]
          properties:
            dataset_id: {type: string}
            method: {type: string, minLength: 1}
            description: {type: string, minLength: 1}
            group_columns:
              type: array
              items: {type: string}
            stratify_columns:
              type: array
              items: {type: string}
            source_fold_mapping:
              type: object
              additionalProperties: true
            n_folds:
              type: integer
              minimum: 2
      leakage_constraints:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      random_seed:
        type: integer
  evaluation:
    type: object
    additionalProperties: false
    required: [primary_metric, metrics, reporting]
    properties:
      primary_metric:
        type: string
      metrics:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [name, direction, description]
          properties:
            name: {type: string}
            direction: {enum: [minimize, maximize]}
            description: {type: string, minLength: 1}
      reporting:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum: [per_dataset, pooled_macro, per_target, per_label, per_fold]

$defs:
  dataset:
    type: object
    additionalProperties: false
    required: [dataset_id, path]
    properties:
      dataset_id:
        type: string
      path:
        type: string
      exclusions_file:
        type: string
      filters:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [column, operator]
          properties:
            column: {type: string}
            operator:
              enum: [equals, not_equals, in, not_in, not_null]
            value: {}
            values:
              type: array
      notes:
        type: string
