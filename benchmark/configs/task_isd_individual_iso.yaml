schema_version: "0.1"

task:
  id: isd_individual_iso_prediction
  version: 0.1.0
  title: ISD individual ISO response prediction
  status: draft
  unit_of_analysis: response
  task_type: multi_output_regression
  description: >-
    Predict individual ISO Pleasantness and Eventfulness responses using the
    clip partition inherited through clip_id.

input:
  record_type: responses
  id_column: response_id
  split_link_column: clip_id
  datasets:
    - dataset_id: ISD
      path: datasets/ISD/data/responses.csv
      notes: >-
        Each response inherits the released partition of its clip. Models must
        not split assessments from the same clip across partitions.

target:
  columns: [ISOPleasant, ISOEventful]
  representation: Individual ISO 12913 Method A coordinates per assessment.
  scale: {minimum: -1, maximum: 1}
  aggregation: No target aggregation before individual-level model evaluation.
  missing_value_policy: drop_row

split_protocol:
  status: released
  version: 0.1.0
  protocol: fixed_train_dev_test
  assignment_files:
    ISD: benchmark/splits/isd_split.csv
  rules:
    - dataset_id: ISD
      method: inherit_clip_assignment
      group_columns: [clip_id]
      description: Every response inherits the deterministic partition assigned to its clip_id.
  leakage_constraints:
    - Responses linked to the same clip_id must occur in exactly one partition.
    - Clip partitioning is performed before response-level model fitting.
    - Test responses must not be used for preprocessing or model selection.
  random_seed: 2026

evaluation:
  primary_metric: rmse
  metrics:
    - name: rmse
      direction: minimize
      description: Root mean squared error per individual ISO coordinate.
    - name: mae
      direction: minimize
      description: Mean absolute error per individual ISO coordinate.
    - name: r2
      direction: maximize
      description: Coefficient of determination per individual ISO coordinate.
    - name: kl_divergence
      direction: minimize
      description: KL divergence between observed and predicted test-set KDEs.
    - name: js_divergence
      direction: minimize
      description: Jensen-Shannon divergence between observed and predicted test-set KDEs.
    - name: dme
      direction: minimize
      description: Normalised integrated absolute error between the two KDEs.
  reporting: [per_dataset, per_target]
