schema_version: "0.1"

task:
  id: araus_appropriateness
  version: 0.1.0
  title: ARAUS contextual appropriateness regression
  status: draft
  unit_of_analysis: clip
  task_type: regression
  description: Predict the mean appropriateness rating for each eligible ARAUS augmented stimulus.

input:
  record_type: clips
  id_column: clip_id
  datasets:
    - dataset_id: ARAUS
      path: datasets/ARAUS/data/clips.csv
      filters:
        - column: is_common_stimulus
          operator: equals
          value: false
      notes: Common practice, attention, and consistency stimuli are excluded.

target:
  columns: [mean_appropriate]
  representation: Clip-level arithmetic mean on the source 1-5 response scale.
  scale: {minimum: 1, maximum: 5}
  aggregation: Mean across valid ARAUS responses linked to each augmented stimulus.
  missing_value_policy: drop_row

split_protocol:
  status: released
  version: 0.1.0
  protocol: fixed_train_dev_test
  assignment_files:
    ARAUS: benchmark/splits/araus_split.csv
  rules:
    - dataset_id: ARAUS
      method: source_fold_mapping
      source_fold_mapping:
        train: [1, 2, 3, 4]
        dev: [5]
        test: [0]
        excluded: [-1, 6, 7]
      description: Preserve the published fold structure and exclude auxiliary common stimuli.
  leakage_constraints:
    - A clip_id must occur in exactly one benchmark partition.
    - Auxiliary common stimuli must not enter training or evaluation.
  random_seed: 2026

evaluation:
  primary_metric: rmse
  metrics:
    - name: rmse
      direction: minimize
      description: Root mean squared error on mean appropriateness.
    - name: mae
      direction: minimize
      description: Mean absolute error on mean appropriateness.
    - name: r2
      direction: maximize
      description: Coefficient of determination for mean appropriateness.
  reporting: [per_dataset]
