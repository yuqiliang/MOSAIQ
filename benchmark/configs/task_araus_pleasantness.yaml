schema_version: "0.1"

task:
  id: araus_pleasantness_regression
  version: 0.1.0
  title: ARAUS ISO Pleasantness regression
  status: draft
  unit_of_analysis: clip
  task_type: regression
  description: >-
    Predict clip-level mean ISO Pleasantness for comparison with the published
    ARAUS feature-based reference baselines.

input:
  record_type: clips
  id_column: clip_id
  datasets:
    - dataset_id: ARAUS
      path: datasets/ARAUS/data/clips.csv
      filters:
        - column: is_common_stimulus
          operator: equals
          value: false
      notes: Common practice, attention, and consistency stimuli are excluded.

target:
  columns: [mean_ISOPleasant]
  representation: Clip-level mean ISO 12913 Method A Pleasantness coordinate.
  scale: {minimum: -1, maximum: 1}
  aggregation: Mean across valid individual ARAUS responses for each stimulus.
  missing_value_policy: drop_row

split_protocol:
  status: released
  version: 0.1.0
  protocol: fixed_train_dev_test
  assignment_files:
    ARAUS: benchmark/splits/araus_split.csv
  rules:
    - dataset_id: ARAUS
      method: source_fold_mapping
      source_fold_mapping:
        train: [1, 2, 3, 4]
        dev: [5]
        test: [0]
        excluded: [-1, 6, 7]
      description: Preserve the published ARAUS folds and exclude auxiliary common stimuli.
  leakage_constraints:
    - A clip_id must occur in exactly one benchmark partition.
    - Auxiliary common stimuli must not enter training or evaluation.
  random_seed: 2026

evaluation:
  primary_metric: rmse
  metrics:
    - name: rmse
      direction: minimize
      description: Root mean squared error on mean ISO Pleasantness.
    - name: mae
      direction: minimize
      description: Mean absolute error on mean ISO Pleasantness.
    - name: r2
      direction: maximize
      description: Coefficient of determination for mean ISO Pleasantness.
    - name: pearson_r
      direction: maximize
      description: Pearson correlation between observed and predicted values.
    - name: spearman_rho
      direction: maximize
      description: Spearman rank correlation between observed and predicted values.
  reporting: [per_dataset]
