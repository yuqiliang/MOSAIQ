name: Validate data package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync

      - name: Validate Frictionless data package
        run: uv run frictionless validate datapackage.yaml

      - name: Run Python validation script
        run: uv run python scripts/validate_in_python.py
