name: Validate data packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest -q

      - name: Validate catalogue package
        run: uv run frictionless validate catalogue/datapackage.yaml

      - name: Validate ISD package
        run: uv run frictionless validate datasets/ISD/datapackage.yaml --trusted

      - name: Validate ARAUS package
        run: uv run frictionless validate datasets/ARAUS/datapackage.yaml --trusted

      - name: Validate SATP package
        run: uv run frictionless validate datasets/SATP/datapackage.yaml

      - name: Validate DeLTA package
        run: uv run frictionless validate datasets/DeLTA/datapackage.yaml

      - name: Validate benchmark contracts and splits
        run: |
          uv run python scripts/validate_benchmark_tasks.py
          uv run python scripts/validate_benchmark_splits.py
          uv run python scripts/validate_submission.py benchmark/submissions/submission_template.csv --allow-empty

      - name: Validate committed ISD audio smoke outputs
        run: |
          uv run frictionless validate benchmark/audio/manifests/isd_groningen_audio_manifest.csv --schema benchmark/audio/audio_manifest.schema.yaml
          uv run python scripts/validate_audio_manifest.py benchmark/audio/manifests/isd_groningen_audio_manifest.csv
          uv run python scripts/validate_audio_smoke_outputs.py

      - name: Validate frozen ISD audio reference outputs
        run: |
          uv run frictionless validate benchmark/audio/manifests/isd_audio_manifest_v0.1.0.csv --schema benchmark/audio/audio_manifest.schema.yaml
          uv run python scripts/validate_audio_manifest.py benchmark/audio/manifests/isd_audio_manifest_v0.1.0.csv
          uv run python scripts/validate_isd_audio_outputs.py

      - name: Validate frozen benchmark and tabular results
        run: |
          uv run python scripts/build_benchmark_report.py --check-only
          uv run python scripts/build_model_cards.py
          uv run python scripts/validate_tabular_baselines.py
          uv run python scripts/validate_robustness_evaluation.py
          uv run python scripts/build_paper2_fixed_outputs.py
          uv run python scripts/validate_paper2_fixed_outputs.py
          git diff --exit-code -- benchmark/model_cards
          git diff --exit-code -- papers/paper2_fixed_outputs
