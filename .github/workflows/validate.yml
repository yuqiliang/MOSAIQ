name: Validate data packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync

      - name: Validate catalogue package
        run: uv run frictionless validate catalogue/datapackage.yaml

      - name: Validate ISD package
        run: uv run frictionless validate datasets/ISD/datapackage.yaml --trusted

      - name: Validate ARAUS package
        run: uv run frictionless validate datasets/ARAUS/datapackage.yaml --trusted

      - name: Validate SATP package
        run: uv run frictionless validate datasets/SATP/datapackage.yaml --trusted

      - name: Validate DeLTA package
        run: uv run frictionless validate datasets/DeLTA/datapackage.yaml

      - name: Validate MOSAIQ linked records
        run: |
          uv run python scripts/validate_mosaiq.py --dataset-dir datasets/ISD --skip-file-check
          uv run python scripts/validate_mosaiq.py --dataset-dir datasets/ARAUS --skip-file-check
          uv run python scripts/validate_mosaiq.py --dataset-dir datasets/SATP --skip-file-check
          uv run python scripts/validate_mosaiq.py --dataset-dir datasets/DeLTA --skip-file-check

      - name: Check FeatureRecords
        run: |
          uv run python scripts/check_feature_records.py --dataset ISD
          uv run python scripts/check_feature_records.py --dataset ARAUS
          uv run python scripts/check_feature_records.py --dataset SATP

      - name: Validate schema-level harmonisation
        run: uv run python scripts/validate_schema_harmonisation.py
