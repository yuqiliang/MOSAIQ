name: Validate data packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync

      - name: Validate catalogue package
        run: uv run frictionless validate catalogue/datapackage.yaml

      - name: Validate ISD package
        run: uv run frictionless validate datasets/ISD/datapackage.yaml
